# Personal Finance Tracker — local dev stack (step 0.4).
#
#   make dev        boot everything (builds the backend image first)
#   make dev-ps     status + health
#   make dev-logs   tail logs
#   make dev-down   stop (data volumes persist across stops)
#
# Configuration lives in ./.env (copy from .env.example). Compose auto-loads
# it for ${VAR} interpolation; every value below has a dev-safe default, so
# `make dev` works even with an empty or missing .env.
#
# Host ports (host port 8080 is already taken on this machine; the dev stack
# uses the 18xxx range — see docs/DEVELOPMENT.md):
#   postgres  15432   backend   18080   keycloak  18081
#   frontend  18082   mailpit   1025 (SMTP) + 18025 (UI)

# Shared environment anchor: the exact env block both the backend and
# worker services need (DATABASE_URL, KEK, the SMTP block, the LLM
# block, and the LLM endpoint SRF guard). A new key both services must
# see goes here ONCE; the services merge it in with `<<: *env` plus
# their own service-specific extras.
x-env: &env
  DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/finance?sslmode=disable}
  KEK: ${KEK:-}
  # SMTP (step 8.3): the mailpit sink; the worker's report dispatch
  # sends via the same mailpit the backend uses.
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_TLS_POLICY: ${SMTP_TLS_POLICY:-none}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  # LLM endpoint SRF guard (internal/llm): comma-separated CIDRs /
  # bare IPs the LLM base URL may additionally resolve to. Unset/
  # empty = no extra admission (the strict policy then admits only
  # public https); the always-rejected set (cloud metadata /
  # link-local, ::1, 0.0.0.0) is never admitted. Dev default = this
  # project's docker bridge subnet (verified with `docker network
  # inspect`), so the opt-in `make dev-llm` llama service is
  # reachable.
  FTRK_LLM_ENDPOINT_CIDRS: ${FTRK_LLM_ENDPOINT_CIDRS:-172.19.0.0/16}

services:
  # postgres:18 — exact minor 18.6, verified 2026-11-02
  # (`docker run --rm postgres:18 psql --version`); recorded in docs/DEVELOPMENT.md.
  # postgres:18+ (docker-library/postgres#1259) stores data in a
  # major-version-specific layout and REFUSES to start with a mount at the
  # legacy default path — the image's own suggestion is a single mount at
  # /var/lib/postgresql (data lands in /var/lib/postgresql/18/main inside
  # the volume), which also keeps pg_upgrade --link possible later.
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - ftrk-pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance"]
      interval: 5s
      timeout: 5s
      retries: 20

  # goose migration runner (step 2.1): runs the goose CLI shipped in the
  # backend image (Dockerfile builds it). No profile, so it runs on EVERY
  # `make dev` with the default command `up` — goose up is an idempotent
  # no-op when the DB is already current, so a fresh stack auto-migrates.
  # `docker compose run --rm migrate up|down|status` appends the action
  # after the entrypoint (the Makefile migrate / migrate-down /
  # migrate-status targets wrap it). The Phase 10 k8s migration Job
  # reuses this same image.
  migrate:
    build: ./backend
    entrypoint:
      - goose
      - -dir
      - /migrations
      - postgres
      - ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/finance?sslmode=disable}
    command: [up]
    volumes:
      - ./backend/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  # The prod image (step 0.2) carries its own HEALTHCHECK (wget /healthz).
  backend:
    build: ./backend
    ports:
      - "18080:8080"
    environment:
      <<: *env
      PORT: "8080"
      # OIDC (step 1.3): OIDC_ISSUER is the token's `iss` (browser horizon).
      # The verifier discovers JWKS against OIDC_DISCOVERY_URL — the container
      # horizon in dev (D-021); empty = OIDC_ISSUER for one-horizon IdPs
      # (Auth0). OIDC_AUDIENCE is the required access-token `aud` (the
      # audience-mapper value, not the client id — D-013).
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:18081/realms/finance}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-finance-api}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-finance-spa}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-http://keycloak:8080/realms/finance}
      NR_LICENSE_KEY: ${NR_LICENSE_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # Categorisation worker (step 5.4): same image as backend (the Dockerfile
  # builds both binaries; the compose service selects the entrypoint — the
  # image ENTRYPOINT is `api`, so the worker service overrides it with
  # `entrypoint: ["worker"]`; a plain `command` would only be appended to
  # the entrypoint, i.e. run `api worker`). Always-on, NOT profile-gated:
  # the categorise job queue is core flow (POST /api/v1/categorise and the
  # import chain enqueue jobs that only this service drains). The worker
  # owns the queue with FOR UPDATE SKIP LOCKED and re-queues 'running'
  # rows at startup, so a single node is correct for dev. Env shares the
  # backend's x-env anchor (top of file): unset means the runner defaults
  # apply (base http://llama:8080/v1, the full-path model id the dev
  # llama.cpp reports in /v1/models), and a user's stored llm_credentials
  # row always wins over env. No keycloak dependency: the worker verifies nothing — it
  # reads users.wrapped_dek + KEK directly.
  worker:
    build: ./backend
    entrypoint: ["worker"]
    environment:
      <<: *env
      # FI sync (step 9.2): dev-only fake adapter + the 8.3 clock override.
      FI_FAKE_ADAPTERS: ${FI_FAKE_ADAPTERS:-}
      FI_FAKE_ADAPTER_FAIL: ${FI_FAKE_ADAPTER_FAIL:-}
      WORKER_FAKE_NOW: ${WORKER_FAKE_NOW:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image HEALTHCHECK is `wget /healthz:8080` (the API's route);
      # the worker runs no HTTP listener, so it would report unhealthy
      # forever. Nothing gates on worker health (no depends_on, no
      # frontend dependency), so disable it rather than fake a route.
      disable: true

  # Dev server (not the nginx image): SvelteKit PUBLIC_* vars are read at
  # runtime by the dev server, so .env changes apply on restart without a
  # rebuild (they are baked in for the static production build).
  frontend:
    image: node:26.13.0
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0"
    ports:
      - "18082:5173"
    environment:
      PUBLIC_API_BASE: /api
      PUBLIC_NR_LICENSE_KEY: ${NR_LICENSE_KEY:-}
      PUBLIC_NR_APPLICATION_ID: ${PUBLIC_NR_APPLICATION_ID:-}
      # OIDC (step 1.2) — build-time vars read by the vite dev server at
      # boot (restart the container after changing .env). PUBLIC_ names
      # are the frontend-specific spelling of the plan §6 canonical vars.
      # NOTE (D-016, refined by D-021): PUBLIC_OIDC_ISSUER is the BROWSER
      # horizon and equals the token's `iss`; the backend verifier validates
      # `iss` against OIDC_ISSUER (same value) but discovers JWKS against
      # OIDC_DISCOVERY_URL (container horizon).
      PUBLIC_OIDC_ISSUER: ${PUBLIC_OIDC_ISSUER:-http://localhost:18081/realms/finance}
      PUBLIC_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-finance-spa}
      PUBLIC_OIDC_AUDIENCE: ${OIDC_AUDIENCE:-finance-api}
      # Target of the /api vite dev proxy (vite.config.ts) — compose
      # service name; standalone dev servers default to localhost:18080.
      VITE_API_PROXY_TARGET: http://backend:8080
    volumes:
      - ./frontend:/app
      - ftrk-npm-cache:/root/.npm
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # node:26 has a global fetch (no curl in the image). The one-liner must
      # be a quoted YAML scalar: the unquoted form contains `: 1` (colon +
      # space) inside the ternary, which YAML parses as a mapping.
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))\""
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Local OIDC IdP for iteration 1 (plan execution envelope): realm
  # 'finance', public SPA client 'finance-spa', 'finance-api' audience,
  # one test user.
  #
  # Realm bootstrap (see deploy/keycloak/dev-init.sh): on FIRST boot only
  # (fresh ftrk-kc-data volume) the committed realm JSON is imported
  # OFFLINE with `kc.sh import --override false` before the server starts
  # — which also creates the admin user with the
  # KC_BOOTSTRAP_ADMIN_PASSWORD value. On a restart the DB is not empty,
  # so the import is skipped and the realm + admin persist in the volume.
  # `kcadm.sh import` was REMOVED in Keycloak 26.8 (26.8.1 verified);
  # `kc.sh import` is the offline 26.x replacement. (KC_BOOTSTRAP_KEYCLOAK_IMPORT
  # appears in `show-config` but is inert at runtime — verified by test;
  # and `kc.sh bootstrap-admin user` must NOT run afterwards — its failure
  # on the existing admin corrupts the admin's password — verified.)
  #
  # dev-init.sh then starts `kc.sh start-dev`, waits for readiness,
  # re-sets the test user's password (idempotent, every boot), and waits
  # on Keycloak.
  #
  # Health checks on Keycloak 26.x: enabled via KC_HEALTH_ENABLED and —
  # unless KC_HTTP_MANAGEMENT_HEALTH_ENABLED=false — served on the
  # management port (9000, which we do not expose). We keep them on the
  # main port 8080 (the dev container exposes that anyway; in prod the
  # k8s probes use the management interface instead).
  # The image ships no curl/wget — the healthcheck uses bash /dev/tcp.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    entrypoint: ["bash", "/opt/keycloak/data/dev-init.sh"]
    command: ["start-dev"]
    environment:
      # KC_BOOTSTRAP_ADMIN_USERNAME/PASSWORD are consumed by the first-boot
      # offline import (dev-init.sh phase 1): the admin user is created
      # WITH the KC_BOOTSTRAP_ADMIN_PASSWORD value. dev-init.sh then mints
      # a fresh admin-cli token with those credentials on EVERY boot and
      # uses it to sync the test user's password via the raw admin API
      # (not kcadm — kcadm 26.8 caches tokens per (server, realm) and 401s
      # on cross-realm calls; a master token DOES authorize other realms).
      # The server does NOT re-sync the admin password from env on later
      # boots — change KC_ADMIN_PASSWORD => delete ftrk-kc-data (docs).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_HEALTH_ENABLED: "false"
      FTRK_TEST_USER_PASSWORD: ${FTRK_TEST_USER_PASSWORD:-test1234}
      # Realm 'finance' access-token lifespan in seconds (round 9; default
      # 3600 since 2026-11-16 — down from 604800: a week of token lifetime
      # was stale-token exposure the SPA didn't need, because its silent
      # refresh renews active sessions well before an hour). Keycloak's
      # default is 60s, which made SPA sessions expire constantly — a stale
      # token 401s on the next API call and the page shows raw error JSON.
      # dev-init.sh syncs it to the persisted realm on EVERY boot (the
      # first-boot offline import does not re-apply env), so changing this
      # in .env takes effect on the next `docker compose up`.
      FTRK_ACCESS_TOKEN_LIFESPAN: ${FTRK_ACCESS_TOKEN_LIFESPAN:-3600}
    ports:
      - "18081:8080"
    volumes:
      - ftrk-kc-data:/opt/keycloak/data
      - ./deploy/keycloak/dev-init.sh:/opt/keycloak/data/dev-init.sh:ro
      - ./deploy/keycloak/finance-realm.json:/opt/keycloak/data/import/finance-realm.json:ro
    healthcheck:
      # No curl/wget in the image — raw HTTP via bash /dev/tcp. Quoted YAML
      # scalar: the command contains `Host: localhost` (colon + space), which
      # an unquoted plain scalar would be misparsed as a mapping.
      test:
        - CMD-SHELL
        - 'bash -c ''exec 3<> /dev/tcp/127.0.0.1/8080 && printf "GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200 "'''
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Mailpit: local SMTP sink (iteration 1 — no external mail, ever).
  # v1.31.6 ships a built-in HEALTHCHECK baked into the scratch-based image,
  # so `docker compose ps` reports it (healthy) with no compose healthcheck
  # needed. Verify mail manually at http://localhost:18025 (API:
  # /api/v1/messages) — but until the mailer lands in a later step it stays
  # empty (0.4's "done when" explicitly requires Mailpit to receive nothing).
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "1025:1025"
      - "18025:8025"

  # llama.cpp LLM (opt-in via the `llm` profile — `make dev-llm`). Two services:
  # llama-init is a one-shot downloader (curlimages/curl) that fetches the pinned
  # model into the ftrk-llm-model volume, sha256-verifies it, and exits 0 — it
  # skips the download when the file is already present and valid, so it is fast
  # on every boot after the first. llama then loads the model and serves the
  # OpenAI-compatible /v1 API on host port 18090. First boot is slow
  # (~2.5 GB model download + image pull). The worker (step 5.4) calls
  # this service when a categorisation job runs; the default
  # categorisation test path is the mock provider. k8s Deployment of the
  # same spec is deferred to Phase 10 (10.2).
  llama-init:
    image: curlimages/curl:8.23.0
    # The image defaults to the unprivileged `curl_user`, but a fresh named
    # volume is root-owned, so the downloader cannot write the model
    # (curl exit 23). A dev-only one-shot service, so run it as root.
    user: root
    restart: "no"
    profiles: [llm]
    volumes:
      - ftrk-llm-model:/models
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        URL="https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
        FILE="/models/qwen3-4b-instruct-2507-q4_k_m.gguf"
        EXPECTED_SHA="3605803b982cb64aead44f6c1b2ae36e3acdb41d8e46c8a94c6533bc4c67e597"
        if [ -f "$$FILE" ] && [ "$$(sha256sum "$$FILE" | cut -d' ' -f1)" = "$$EXPECTED_SHA" ]; then
          echo "llama-init: model already present and valid, skipping download"
          exit 0
        fi
        echo "llama-init: downloading ~2.5 GB model (first boot only; can take a while)"
        curl -fL --retry 3 -o "$$FILE.part" "$$URL"
        GOT_SHA="$$(sha256sum "$$FILE.part" | cut -d' ' -f1)"
        if [ "$$GOT_SHA" != "$$EXPECTED_SHA" ]; then
          echo "llama-init: sha256 mismatch: got $$GOT_SHA, want $$EXPECTED_SHA" >&2
          rm -f "$$FILE.part"
          exit 1
        fi
        mv "$$FILE.part" "$$FILE"
        echo "llama-init: model verified at $$FILE"

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-b12124
    profiles: [llm]
    ports:
      - "18090:8080"
    volumes:
      - ftrk-llm-model:/models
    depends_on:
      llama-init:
        condition: service_completed_successfully
    # --model is the FULL path: llama-server echoes the --model argument
    # verbatim, so /v1/models reports that exact string as the model id
    # and the step 5.4 worker's default LLM_MODEL is the same string
    # (the server does not validate the request's model field — any
    # value is accepted — so this is consistency with /v1/models, not
    # enforcement; verified 2026-11-05). Do NOT override working_dir:
    # the image resolves llama-server's sibling .so files relative to
    # the working directory, so pointing it at /models breaks the
    # loader (exit 127, libllama-server-impl.so — verified 2026-11-05).
    # The image ships its own /health HEALTHCHECK, so no compose
    # healthcheck is added.
    command:
      - --model
      - /models/qwen3-4b-instruct-2507-q4_k_m.gguf
      - --ctx-size
      - "8192"
      - --parallel
      - "2"
      - --host
      - 0.0.0.0
      - --port
      - "8080"

volumes:
  ftrk-pg-data:
  ftrk-kc-data:
  ftrk-npm-cache:
  ftrk-llm-model:
