# Personal Finance Tracker — frontend server block (L41 + L42).
#
# Port 8080 (not 80): the container runs non-root, so the privileged
# port can't be bound. The dev compose stack frontends via vite
# (18082:5173), so nothing in dev maps to this port; production does.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (L41): per-build CSP include generated from the
    # built index.html (scripts/generate-csp.mjs). `always` → the
    # headers also ride 4xx/5xx responses.
    include /etc/nginx/headers.conf;

    # Hashed assets from the SvelteKit build — safe to cache forever.
    location /_app/ {
        # add_header at this level suppresses the server-level
        # inheritance — repeat the security headers here.
        include /etc/nginx/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: real files first, then the app shell.
    location / {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
