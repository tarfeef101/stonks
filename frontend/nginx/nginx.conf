# Personal Finance Tracker — frontend nginx main config (L42 non-root).
#
# No `user` directive: the container runs as the unprivileged `nginx`
# user (Dockerfile `USER nginx`), so the master process already has the
# rights it needs. All temp/pid paths live under /tmp (writable by the
# nginx user). worker_rlimit_nofile is omitted for the same reason.

pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    # The official image is COMPILED with its temp paths under
    # /var/cache/nginx (root-owned — the nginx user cannot mkdir there,
    # startup [emerg]'s without these), so every temp path is relocated
    # under /tmp. nginx creates these subdirectories itself at startup
    # (single-level mkdir); the /tmp/nginx parent is created + chowned in
    # the Dockerfile.
    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path       /tmp/nginx/proxy_temp;
    fastcgi_temp_path     /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path       /tmp/nginx/uwsgi_temp;
    scgi_temp_path        /tmp/nginx/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
