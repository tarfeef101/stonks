<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Theme pre-paint: apply the stored appearance setting before
			// first paint so a dark-mode user never sees a light flash.
			// The value is the user's saved setting ('light' | 'dark' |
			// 'system'); 'system' — also the fallback when nothing is
			// stored — resolves against prefers-color-scheme. The route
			// layout re-applies the server-side setting (source of truth)
			// on load and keeps this key in sync.
			(() => {
				let stored = 'system';
				try {
					stored = localStorage.getItem('ftrk-theme') ?? 'system';
				} catch {
					/* storage unavailable (private mode): use the default */
				}
				const dark =
					stored === 'dark' ||
					(stored === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
