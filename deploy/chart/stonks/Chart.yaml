# stonks — production Helm chart (plan §10.2, D-033/D-035).
#
# `name` MUST stay `stonks-chart`: helm push cannot rename a chart, and the
# OCI package is ghcr.io/tarfeef101/stonks-chart, consumed by the Terraform
# helm_release (infra/).
apiVersion: v2
name: stonks-chart
description: >-
  Personal Finance Tracker production stack: backend API + worker, frontend
  SPA, Postgres, migration hook Job, and the two HTTPRoutes for
  stonks.tareef.tech. All secrets are consumed by name, never carried.
type: application
# 0.1.0 (2026-11-25) failed server-side validation: requestRedirect.path.type
# "Preserve" is not a Gateway API value (see httproute-redirect.yaml). 0.1.1
# is the first installable revision; 0.1.2 (2026-11-26) fixes the HTTPS
# parentRef kind (Gateway -> ListenerSet, see values.yaml ingress). 0.1.3
# (2026-11-26) splits config: the Secret carries only genuinely secret
# values, everything else moves to non-secret chart values (oidc.*,
# newrelic.*, smtp.*, llm.*, postgres.user/db) with fail-fast `required`.
version: 0.1.3
appVersion: "0.1.0"
